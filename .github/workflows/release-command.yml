name: 评论指令触发 EXE 构建

on:
  issue_comment:
    types:
      - created

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  dispatch-pr-build:
    if: >
      github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, '/build-exe') || startsWith(github.event.comment.body, '/release-exe')) &&
      github.event.comment.user.type != 'Bot' &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      )
    runs-on: ubuntu-latest

    steps:
      - name: 解析评论指令
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = (context.payload.comment.body || '').trim();
            const [command, version = ''] = body.split(/\s+/, 2);
            if (command === '/release-exe') {
              core.setFailed('PR 评论不支持 /release-exe。请合并到默认分支或创建 tag 后，在发布 workflow 中构建 Release。');
              return;
            }
            if (command !== '/build-exe') {
              core.setFailed('指令格式无效。可用格式：/build-exe 或 /build-exe v1.2.3');
              return;
            }
            const pull = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            const sourceRef = `refs/pull/${context.issue.number}/head`;
            const sourceSha = pull.data.head.sha;
            const sourceLabel = `${pull.data.head.repo.full_name}:${pull.data.head.ref}`;
            core.setOutput('version', version);
            core.setOutput('source_ref', sourceRef);
            core.setOutput('source_sha', sourceSha);
            core.setOutput('source_label', sourceLabel);

      - name: 触发 PR 构建工作流
        if: success()
        uses: actions/github-script@v7
        env:
          BUILD_VERSION: ${{ steps.parse.outputs.version }}
          SOURCE_REF: ${{ steps.parse.outputs.source_ref }}
          SOURCE_SHA: ${{ steps.parse.outputs.source_sha }}
          SOURCE_LABEL: ${{ steps.parse.outputs.source_label }}
        with:
          script: |
            const version = process.env.BUILD_VERSION || '';
            const sourceRef = process.env.SOURCE_REF || '';
            const sourceSha = process.env.SOURCE_SHA || '';
            const sourceLabel = process.env.SOURCE_LABEL || '';

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pr-build-exe.yml',
              ref: context.payload.repository.default_branch,
              inputs: {
                version,
                source_ref: sourceRef,
                source_sha: sourceSha,
                source_label: sourceLabel
              }
            });

      - name: 回复触发结果
        if: success()
        uses: actions/github-script@v7
        env:
          BUILD_VERSION: ${{ steps.parse.outputs.version }}
          SOURCE_SHA: ${{ steps.parse.outputs.source_sha }}
        with:
          script: |
            const version = process.env.BUILD_VERSION || '';
            const sourceSha = process.env.SOURCE_SHA || '';
            const summary = `已触发 PR EXE 构建工作流${version ? `，版本标识 \`${version}\`` : ''}，源提交 \`${sourceSha}\`。该构建不会读取发布/签名密钥，也不会创建 Release。`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: summary
            });

      - name: 回复指令错误
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '指令格式无效。PR 评论仅支持：`/build-exe`、`/build-exe v1.2.3`。创建 Release 请在默认分支或 tag 上运行发布 workflow。'
            });
