name: 构建并发布 Windows EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号，例如 v1.2.3；留空时只生成手动构建产物"
        required: false
        type: string
      create_release:
        description: "是否自动创建 GitHub Release"
        required: true
        default: false
        type: boolean
      draft:
        description: "创建 Release 时是否使用草稿状态"
        required: true
        default: true
        type: boolean
      release_notes:
        description: "可选，Release 说明"
        required: false
        type: string
      source_ref:
        description: "可选，构建源码 ref；评论触发 PR 构建时由转发工作流传入"
        required: false
        type: string
      source_sha:
        description: "可选，构建源码 SHA；评论触发 PR 构建时由转发工作流传入"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.ref }}

      - name: 等待自动检查通过
        uses: actions/github-script@v7
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sourceRef = process.env.SOURCE_REF || '';
            const targetSha = process.env.SOURCE_SHA || context.sha;
            const defaultBranch = context.payload.repository?.default_branch || 'master';
            const maxAttempts = 30;
            const delayMs = 20000;
            const isAlternateSource = Boolean(sourceRef) && sourceRef !== context.ref;

            if (context.eventName === 'workflow_dispatch' && !isAlternateSource && context.ref.replace('refs/heads/', '') !== defaultBranch) {
              core.setFailed(`手动发布只允许从默认分支 ${defaultBranch} 触发，当前为 ${context.ref}。`);
              return;
            }
            if (isAlternateSource) {
              core.info(`本次构建使用外部源码 ref ${sourceRef} (${targetSha})，跳过默认分支自动检查门禁；后续步骤会重新运行语法检查和单元测试。`);
              return;
            }

            function summarizeRun(run) {
              return `#${run.run_number} ${run.status}/${run.conclusion || 'pending'} ${run.head_branch} ${run.html_url}`;
            }

            for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: 'ci.yml',
                head_sha: targetSha,
                per_page: 20,
              });

              const runs = response.data.workflow_runs
                .filter((run) => run.head_branch === defaultBranch);

              const successfulRun = runs.find(
                (run) => run.status === 'completed' && run.conclusion === 'success'
              );
              if (successfulRun) {
                core.info(`检测到当前提交的自动检查已通过：${summarizeRun(successfulRun)}`);
                return;
              }

              const inProgressRuns = runs.filter((run) => run.status !== 'completed');
              const failedRuns = runs.filter(
                (run) => run.status === 'completed' && run.conclusion && run.conclusion !== 'success'
              );

              if (attempt === maxAttempts) {
                const details = runs.length
                  ? runs.map(summarizeRun).join('\n')
                  : '未找到当前提交在默认分支上的自动检查记录。';
                core.setFailed(
                  `发布前校验失败：当前提交 ${targetSha} 对应的“自动检查”尚未在 ${defaultBranch} 上成功。\n${details}`
                );
                return;
              }

              if (inProgressRuns.length > 0) {
                core.info(
                  `第 ${attempt}/${maxAttempts} 次检查：自动检查仍在运行，等待 ${(delayMs / 1000).toFixed(0)} 秒后继续。`
                );
              } else if (failedRuns.length > 0) {
                core.info(
                  `第 ${attempt}/${maxAttempts} 次检查：发现失败的自动检查，但尚未看到成功结果，等待 ${(delayMs / 1000).toFixed(0)} 秒后继续。`
                );
              } else {
                core.info(
                  `第 ${attempt}/${maxAttempts} 次检查：尚未发现当前提交在 ${defaultBranch} 上的自动检查记录，等待 ${(delayMs / 1000).toFixed(0)} 秒后继续。`
                );
              }

              await new Promise((resolve) => setTimeout(resolve, delayMs));
            }

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖与打包工具
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: 准备代码签名证书
        shell: pwsh
        env:
          WINDOWS_CODESIGN_CERT_BASE64: ${{ secrets.WINDOWS_CODESIGN_CERT_BASE64 }}
          WINDOWS_CODESIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_CERT_PASSWORD }}
          WINDOWS_CODESIGN_TIMESTAMP_URL: ${{ vars.WINDOWS_CODESIGN_TIMESTAMP_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_CERT_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_CERT_PASSWORD)) {
            Write-Host "未配置代码签名证书，跳过签名准备。"
            exit 0
          }

          $certPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_CERT_BASE64))
          $timestampUrl = $env:WINDOWS_CODESIGN_TIMESTAMP_URL
          if ([string]::IsNullOrWhiteSpace($timestampUrl)) {
            $timestampUrl = "http://timestamp.digicert.com"
          }
          "SIGN_PFX_PATH=$certPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SIGN_PFX_PASSWORD=$env:WINDOWS_CODESIGN_CERT_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SIGN_TIMESTAMP_URL=$timestampUrl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 运行测试
        run: |
          python -m py_compile gcp.py gcp_app.py gcp_cli.py gcp_clients.py gcp_config.py gcp_doctor.py gcp_firewall.py gcp_instance.py gcp_ips.py gcp_logging.py gcp_menu.py gcp_models.py gcp_operations.py gcp_remote.py gcp_reroll.py gcp_state.py gcp_utils.py scripts/build_exe.py
          python -m unittest discover -s tests -v

      - name: 计算构建版本
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CREATE_RELEASE: ${{ inputs.create_release }}
          INPUT_DRAFT: ${{ inputs.draft }}
          INPUT_RELEASE_NOTES: ${{ inputs.release_notes }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          GIT_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          $eventName = $env:GITHUB_EVENT_NAME
          $inputVersion = $env:INPUT_VERSION
          $createRelease = $env:INPUT_CREATE_RELEASE
          $draftRelease = $env:INPUT_DRAFT
          $releaseNotes = $env:INPUT_RELEASE_NOTES

          if ([string]::IsNullOrWhiteSpace($createRelease)) {
            $createRelease = "false"
          }
          if ([string]::IsNullOrWhiteSpace($draftRelease)) {
            $draftRelease = "true"
          }

          if ($eventName -eq "push") {
            $version = $env:REF_NAME
            $createRelease = "true"
            $draftRelease = "false"
            $releaseNotes = "自动从 tag ${version} 构建并发布 Windows EXE。"
          } elseif ([string]::IsNullOrWhiteSpace($inputVersion)) {
            $manualVersion = "manual-$($env:RUN_NUMBER)-$($env:GIT_SHA)"
            $version = $manualVersion.Substring(0, [Math]::Min(22, $manualVersion.Length))
          } else {
            $version = $inputVersion.Trim()
          }

          if ($version -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$') {
            throw "version 只能包含字母、数字、点、下划线和短横线，且长度不能超过 128。"
          }
          $createRelease = $createRelease.ToLowerInvariant()
          $draftRelease = $draftRelease.ToLowerInvariant()
          if ($createRelease -notin @("true", "false")) {
            throw "create_release 必须是 true 或 false。"
          }
          if ($draftRelease -notin @("true", "false")) {
            throw "draft 必须是 true 或 false。"
          }

          if ($createRelease -eq "true" -and [string]::IsNullOrWhiteSpace($inputVersion) -and $eventName -ne "push") {
            throw "创建 Release 时必须提供 version。"
          }

          "BUILD_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CREATE_RELEASE=$createRelease" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_DRAFT=$draftRelease" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "build_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "create_release=$createRelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_draft=$draftRelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          do {
            $notesDelimiter = [Guid]::NewGuid().ToString("N")
          } while (($releaseNotes | Out-String).Contains($notesDelimiter))
          "RELEASE_NOTES<<$notesDelimiter" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $releaseNotes | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $notesDelimiter | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "release_notes<<$notesDelimiter" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $releaseNotes | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $notesDelimiter | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: 构建 EXE
        shell: pwsh
        env:
          GITHUB_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          $command = @(
            "python",
            "scripts/build_exe.py",
            "--clean",
            "--version",
            $env:BUILD_VERSION
          )
          if (-not [string]::IsNullOrWhiteSpace($env:SIGN_PFX_PATH)) {
            $command += @("--sign-pfx", $env:SIGN_PFX_PATH, "--sign-password", $env:SIGN_PFX_PASSWORD)
            if (-not [string]::IsNullOrWhiteSpace($env:SIGN_TIMESTAMP_URL)) {
              $command += @("--timestamp-url", $env:SIGN_TIMESTAMP_URL)
            }
          }
          & $command[0] $command[1..($command.Length - 1)]

      - name: 清理代码签名证书
        if: always() && env.SIGN_PFX_PATH != ''
        shell: pwsh
        run: |
          if (Test-Path $env:SIGN_PFX_PATH) {
            Remove-Item -LiteralPath $env:SIGN_PFX_PATH -Force
          }

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: gcp-free-windows-exe-${{ steps.version.outputs.build_version }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30

      - name: 创建 GitHub Release
        if: steps.version.outputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.build_version }}
          target_commitish: ${{ inputs.source_sha || github.sha }}
          name: ${{ steps.version.outputs.build_version }}
          draft: ${{ steps.version.outputs.release_draft == 'true' }}
          body: ${{ steps.version.outputs.release_notes }}
          files: |
            dist/release/*.zip
