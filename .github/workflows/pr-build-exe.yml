name: PR Windows EXE 构建

on:
  workflow_dispatch:
    inputs:
      version:
        description: "可选版本标识；留空时自动生成 PR 构建版本"
        required: false
        type: string
      source_ref:
        description: "PR 源码 ref，由评论指令工作流传入"
        required: true
        type: string
      source_sha:
        description: "PR 源码 SHA，由评论指令工作流传入"
        required: true
        type: string
      source_label:
        description: "PR 源码来源说明"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pr-build-exe-${{ inputs.source_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  build-windows-exe:
    runs-on: windows-2025-vs2026
    env:
      PYTHONWARNINGS: ignore::FutureWarning:google.api_core._python_version_support

    steps:
      - name: 检出 PR 代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: 校验源码提交
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_LABEL: ${{ inputs.source_label }}
        run: |
          $actualSha = (git rev-parse HEAD).Trim()
          if ([string]::IsNullOrWhiteSpace($env:SOURCE_SHA)) {
            throw "source_sha 不能为空。"
          }
          if ($actualSha.ToLowerInvariant() -ne $env:SOURCE_SHA.ToLowerInvariant()) {
            throw "检出的源码 SHA 不匹配。期望 $env:SOURCE_SHA，实际 $actualSha。"
          }
          Write-Host "已检出 PR 源码：$env:SOURCE_LABEL ($actualSha)"

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: 安装依赖与打包工具
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: 运行测试
        run: |
          python -m py_compile gcp.py gcp_app.py gcp_cli.py gcp_clients.py gcp_config.py gcp_doctor.py gcp_firewall.py gcp_instance.py gcp_ips.py gcp_logging.py gcp_menu.py gcp_models.py gcp_operations.py gcp_remote.py gcp_reroll.py gcp_state.py gcp_utils.py scripts/build_exe.py
          python -m unittest discover -s tests -v

      - name: 计算构建版本
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          $inputVersion = $env:INPUT_VERSION
          if ([string]::IsNullOrWhiteSpace($inputVersion)) {
            $manualVersion = "pr-$($env:RUN_NUMBER)-$($env:SOURCE_SHA)"
            $version = $manualVersion.Substring(0, [Math]::Min(22, $manualVersion.Length))
          } else {
            $version = $inputVersion.Trim()
          }

          if ($version -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$') {
            throw "version 只能包含字母、数字、点、下划线和短横线，且长度不能超过 128。"
          }

          "BUILD_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "build_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: 构建 EXE
        shell: pwsh
        env:
          GITHUB_SHA: ${{ inputs.source_sha }}
        run: |
          python scripts/build_exe.py --clean --version $env:BUILD_VERSION

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: gcp-free-pr-windows-exe-${{ steps.version.outputs.build_version }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
